name: Publish work record request

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Fixed source project identifier"
        required: true
        type: string
      source_commit_sha:
        description: "Exact 40-character source commit SHA"
        required: true
        type: string
      target_basename:
        description: "One work-record basename, for example work_record_014"
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_PROJECT_ID: tech_article_nortification
  TARGET_REPOSITORY: tj-999-comp/sandbox-pages
  TARGET_WORKFLOW: accept-source.yml
  TARGET_REF: main

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate request shape
        shell: bash
        env:
          REQUEST_PROJECT_ID: ${{ inputs.project_id }}
          REQUEST_SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          REQUEST_TARGET_BASENAME: ${{ inputs.target_basename }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST_PROJECT_ID" != "$EXPECTED_PROJECT_ID" ]]; then
            echo "project_id does not match the fixed source project" >&2
            exit 1
          fi
          if [[ ! "$REQUEST_SOURCE_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_commit_sha must be a 40-character commit SHA" >&2
            exit 1
          fi
          if [[ ! "$REQUEST_TARGET_BASENAME" =~ ^work_record_[0-9]{3}$ ]]; then
            echo "target_basename must be one work_record_### basename" >&2
            exit 1
          fi

      - name: Checkout requested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate requested source commit and record
        shell: bash
        env:
          REQUEST_PROJECT_ID: ${{ inputs.project_id }}
          REQUEST_SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          REQUEST_TARGET_BASENAME: ${{ inputs.target_basename }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "$REQUEST_SOURCE_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [[ "$checked_out_sha" != "$requested_sha" ]]; then
            echo "checkout did not resolve to the requested commit" >&2
            exit 1
          fi
          python3 scripts/validate_publish_request.py \
            --project-id "$REQUEST_PROJECT_ID" \
            --source-commit-sha "$REQUEST_SOURCE_COMMIT_SHA" \
            --target-basename "$REQUEST_TARGET_BASENAME"

      - name: Select dispatch authentication
        id: auth
        env:
          PUBLISH_APP_ID: ${{ secrets.PUBLISH_APP_ID }}
          PUBLISH_APP_PRIVATE_KEY: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          PAT_TOKEN: ${{ secrets.SANDBOX_PAGES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          app_id_set=false
          private_key_set=false
          pat_set=false
          [[ -n "$PUBLISH_APP_ID" ]] && app_id_set=true
          [[ -n "$PUBLISH_APP_PRIVATE_KEY" ]] && private_key_set=true
          [[ -n "$PAT_TOKEN" ]] && pat_set=true

          if [[ "$app_id_set" != "$private_key_set" ]]; then
            echo "PUBLISH_APP_ID and PUBLISH_APP_PRIVATE_KEY must be configured together" >&2
            exit 1
          fi

          if [[ "$app_id_set" == "true" ]]; then
            echo "use_app=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=github-app" >> "$GITHUB_OUTPUT"
          elif [[ "$pat_set" == "true" ]]; then
            echo "use_app=false" >> "$GITHUB_OUTPUT"
            echo "auth_mode=fine-grained-pat" >> "$GITHUB_OUTPUT"
          else
            echo "Configure GitHub App credentials or SANDBOX_PAGES_DISPATCH_TOKEN" >&2
            exit 1
          fi

      - name: Create GitHub App installation token
        id: app-token
        if: steps.auth.outputs.use_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: tj-999-comp
          repositories: sandbox-pages
          permission-actions: write

      - name: Dispatch sandbox-pages acceptance workflow
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.SANDBOX_PAGES_DISPATCH_TOKEN }}
          AUTH_MODE: ${{ steps.auth.outputs.auth_mode }}
          REQUEST_PROJECT_ID: ${{ inputs.project_id }}
          REQUEST_SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          REQUEST_TARGET_BASENAME: ${{ inputs.target_basename }}
        run: |
          set -euo pipefail
          if [[ -n "$APP_TOKEN" ]]; then
            export GH_TOKEN="$APP_TOKEN"
          else
            export GH_TOKEN="$PAT_TOKEN"
          fi
          test -n "$GH_TOKEN"
          echo "Dispatch authentication: $AUTH_MODE"

          gh api \
            --method POST \
            "repos/$TARGET_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -f "ref=$TARGET_REF" \
            -f "inputs[project_id]=$REQUEST_PROJECT_ID" \
            -f "inputs[source_commit_sha]=$REQUEST_SOURCE_COMMIT_SHA" \
            -f "inputs[target_basename]=$REQUEST_TARGET_BASENAME"
